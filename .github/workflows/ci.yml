name: CI

# Until this existed there was NOTHING between a commit and production: a push to
# master went straight to rsync + build on the VPS. The tests were already here
# and already fast — they simply never ran.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: types + fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Match PRODUCTION, not the newest release. The VPS runs 24.19.0 since
      # 2026-08-15 (it was 22.22.0 before), and the API runs on it, so a green
      # gate on a different major would prove less than it appears to.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.x'
          cache: npm

      - run: npm ci

      - name: Fast verification
        run: npm run verify -- --profile fast --output .tmp/verification-ci

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: .tmp/verification-ci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  # Functional browser checks gate CI; visual pixel comparisons report separately.
  browser:
    name: browser suite (functional, gates)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.x'
          cache: npm

      - run: npm ci

      # Nothing else in this repository installs a browser — no postinstall, no
      # npm script — so a fresh runner has none. Chromium only: the config
      # declares no `projects`, so the suite never asks for Firefox or WebKit.
      # `--with-deps` shells out to `apt-get` under sudo, and apt on a GitHub
      # runner stalls when unattended-upgrades is holding the dpkg lock. That is
      # not hypothetical: it ate two entire 25-minute jobs here on 2026-08-19,
      # both cancelled by the job timeout with the log ending on
      # `Terminate orphan process: npm exec playwright install --with-deps
      # chromium`. The baselines were never drawn, and because the upload step
      # runs `if: always()` it cheerfully uploaded the repository's OWN committed
      # PNGs — an artifact that looked like a result and contained nothing new.
      #
      # So: cache the browser so most runs download nothing, bound each attempt
      # so a stalled apt fails in five minutes instead of twenty-five, and retry,
      # because a dpkg lock is usually gone by the second try.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        timeout-minutes: 18
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::chromium install attempt $attempt did not finish; retrying"
            sleep 20
          done
          echo "::error::chromium could not be installed in three bounded attempts"
          exit 1

      # The suite starts its own API and Vite through playwright.config.ts. The
      # API runs with CATALOG_ARTIFACT_ONLY=1, so it serves the catalogue
      # artifact committed here instead of racing the live Radio Browser
      # mirrors: no network dependency, no 8s × MAX_PAGES chain inside a 30s
      # test. It needs no secrets — every boot-fatal check in the API is gated
      # on NODE_ENV=production, which Actions does not set.
      #
      # `--workers=1` is deliberate and is the whole reason this job has a
      # chance of being trustworthy. The flakes that kept the suite out of CI
      # were attributed to parallel load, and that reproduced here: the same
      # specs that pass serially failed twice in one parallel run
      # (`.station-feed-overlay` never appearing, and a `mouse.move` timing out
      # mid-drag). Serially they are 225/225 twice, 6.4 and 6.1 minutes. A
      # 2-core runner would give one worker anyway — this makes it explicit
      # rather than a property of whatever hardware GitHub hands out. It is also
      # what let the screenshots capture at all: the `Protocol error` above was
      # the default worker count.
      - name: Playwright
        env:
          PLAYWRIGHT_SKIP_PIXELS: '1'
        run: npm --workspace apps/webapp run test:e2e:functional

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/webapp/playwright-report/
          retention-days: 7

  # The pixel half, kept OUT of the merge path on purpose.
  #
  # A baseline failure does not mean the product is broken. It usually means
  # somebody changed the design and the committed PNGs have not been re-drawn,
  # and that verdict belongs to a person looking at the pictures. That is what
  # `visual-baselines.yml` is for, and why it commits nothing.
  #
  # This is NOT a licence to leave it red forever: leaving a red job unread is
  # the exact mistake this split repairs. The two home-shell baselines have been
  # stale since `2096836` (the glass restoration) and are stale AGAIN after the
  # low-power nav fill, which changes the nav on precisely the kind of machine
  # CI runs on. Re-draw with `visual-baselines.yml`, LOOK at the artifacts,
  # then commit them.
  pixels:
    name: visual baselines (reports, does not gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.x'
          cache: npm

      - run: npm ci

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        timeout-minutes: 18
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::chromium install attempt $attempt did not finish; retrying"
            sleep 20
          done
          echo "::error::chromium could not be installed in three bounded attempts"
          exit 1

      - name: Playwright (pixels only)
        run: npm --workspace apps/webapp run test:e2e:pixels

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pixels
          path: apps/webapp/playwright-report/
          retention-days: 7
