name: Draw visual baselines on Linux

# Manual only, and it deliberately does NOT commit anything.
#
# Every baseline in this repository is a `-win32.png`, taken on the one Windows
# machine the suite has ever run on. Playwright appends `process.platform` to a
# snapshot name, so on a Linux runner it looks for `-linux.png`, finds nothing,
# and fails — which is why CI's browser job skips the pixel specs entirely and
# compares no appearance at all.
#
# This job draws that missing set and uploads it. A person then LOOKS at the
# PNGs and decides whether that is what the product should look like, and only
# then are they committed. Having CI commit its own output would fix the red and
# lose the point: the thing under test is the appearance, and nothing would ever
# have looked at it.
on:
  workflow_dispatch:

jobs:
  draw:
    name: draw them, upload them, commit nothing
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.x'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # --workers=1 on purpose: the browser job's second run died on
      # `page.screenshot: Protocol error (Page.captureScreenshot)` with the
      # default worker count, and the largest clip here is 1440x1688 on a
      # 2-core runner.
      - name: Draw the baselines
        working-directory: apps/webapp
        run: npx playwright test tests/visual.spec.ts --update-snapshots --workers=1

      - name: What was drawn
        if: always()
        run: |
          ls -la apps/webapp/tests/visual.spec.ts-snapshots/ | grep -- '-linux' || true
          echo "---"
          ls apps/webapp/tests/visual.spec.ts-snapshots/ | grep -c -- '-linux' || true

      - name: Upload for a human to look at
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: apps/webapp/tests/visual.spec.ts-snapshots/*-linux.png
          retention-days: 14
          if-no-files-found: error
