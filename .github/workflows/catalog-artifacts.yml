name: Refresh Catalog Artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # Node 20 went end-of-life in April 2026, and this job commits to
          # master. Keep it on the runtime production actually uses.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run catalog:update

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/catalog-fast.json artifacts/catalog-full.json
          if git diff --cached --quiet; then
            echo "No artifact changes"
            exit 0
          fi
          git commit -m "chore: refresh catalog artifacts"
          git push
