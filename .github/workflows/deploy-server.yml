name: Deploy RadioAtlas to VPS

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

concurrency:
  group: radioatlas-production
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # The release waits for the tests that describe THIS commit.
  #
  # ⚠ Measured on 965925e: CI and Deploy start independently from the same
  # push, and the deploy finished about SEVEN MINUTES before the functional
  # browser suite did. Production was already serving the new release while the
  # only evidence it worked was still being gathered — and if the suite had gone
  # red, the listeners already had the change.
  #
  # `head_sha` is the whole point. A "was CI green?" check that reads the latest
  # run on the branch answers a question about somebody else's commit, which is
  # worse than no check: it looks like a gate and is a coin toss.
  #
  # The pixel job is deliberately NOT required. A baseline failure means a
  # deliberate redesign nobody re-drew, and that verdict belongs to a person
  # looking at the PNGs — blocking the release on it would train everyone to
  # bypass the gate, which is exactly how the browser job ended up
  # `continue-on-error` and red for twenty runs.
  await-ci:
    name: CI must be green for THIS commit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'push'
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for the gating checks on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required=("types + fast tests" "browser suite (functional, gates)")
          deadline=$(( $(date +%s) + 35 * 60 ))

          while :; do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, .conclusion // "pending"] | @tsv')

            missing=(); failed=(); waiting=()
            for name in "${required[@]}"; do
              line=$(printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1 == n {print; exit}')
              if [ -z "$line" ]; then missing+=("$name"); continue; fi
              status=$(printf '%s' "$line" | cut -f2)
              conclusion=$(printf '%s' "$line" | cut -f3)
              if [ "$status" != "completed" ]; then waiting+=("$name"); continue; fi
              if [ "$conclusion" != "success" ]; then failed+=("$name ($conclusion)"); fi
            done

            if [ ${#failed[@]} -gt 0 ]; then
              echo "::error::CI failed for $SHA: ${failed[*]}. Nothing is deployed."
              exit 1
            fi
            if [ ${#missing[@]} -eq 0 ] && [ ${#waiting[@]} -eq 0 ]; then
              echo "All gating checks green for $SHA."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              # ⚠ A timeout is a REFUSAL, not a pass. "The check never appeared"
              # and "the check passed" must never reach the same exit code.
              echo "::error::Timed out waiting for $SHA. missing=[${missing[*]-}] waiting=[${waiting[*]-}]"
              exit 1
            fi
            echo "waiting: missing=[${missing[*]-}] running=[${waiting[*]-}]"
            sleep 20
          done

  deploy:
    runs-on: ubuntu-latest
    needs: [await-ci]
    # `workflow_dispatch` skips the gate above, so `success()` alone would
    # block every manual deploy. A SKIPPED gate is allowed through; a FAILED
    # one never is.
    if: >-
      always() &&
      (needs.await-ci.result == 'success' || needs.await-ci.result == 'skipped')
    env:
      APP_ROOT: /opt/RadioAtlas
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      # Every release directory starts empty, so this used to send the whole
      # 89MB working tree on every deploy, to a 2-core box that is shared with
      # other services and whose swap is permanently in use. --link-dest points
      # rsync at the previous release, so anything already there is taken from
      # local disk instead of the wire. Measured on the first run: 3 files of
      # 650 transferred, 38KB sent instead of 89MB, speedup 2158.
      #
      # It does NOT save disk, and that surprised the change: `-a` preserves
      # mtimes, a git checkout stamps every file with the checkout time, so the
      # source and the previous release always differ in a preserved attribute
      # and rsync copies locally rather than hard-linking. Each release is still
      # its own 132MB on disk. Dropping `-t` would let it link, at the cost of
      # every file's mtime becoming the deploy time — untested, and not worth
      # touching this path again for 260MB on a disk with 15GB free.
      #
      # --checksum is NOT optional here, and that was measured rather than
      # assumed. rsync's default quick check is size + mtime, and a git checkout
      # stamps every file with the checkout time: package.json is byte-identical
      # across two releases (same sha1) with mtimes nine minutes apart, so the
      # quick check calls it changed and --link-dest alone would link nothing at
      # all. Comparing content costs 0.1s for the 37MB catalogue on this box,
      # about 0.4s for the whole tree.
      #
      # Safe against the rest of the deploy either way: rsync writes a changed
      # file new and renames it, and every in-place write later in
      # deploy-release.sh targets a .env file, which is gitignored and so was
      # never in the transfer at all.
      #
      # Best-effort by construction: no `current` symlink — a fresh box, a first
      # deploy — means an empty flag and exactly the behaviour that shipped
      # before this. --stats is here so the next slow deploy leaves evidence
      # instead of an inference.
      - name: Upload release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          TARGET="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PREVIOUS="$(ssh "$TARGET" "readlink -f $APP_ROOT/current 2>/dev/null || true")"
          LINK_DEST=""
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$APP_ROOT/releases/$RELEASE_SHA" ]; then
            LINK_DEST="--link-dest=$PREVIOUS"
            echo "Linking unchanged files against $PREVIOUS"
          else
            echo "No usable previous release; sending a full copy."
          fi
          ssh "$TARGET" "mkdir -p $APP_ROOT/releases/$RELEASE_SHA"
          rsync -az --delete --checksum --stats $LINK_DEST \
            --exclude '.git' \
            --exclude 'node_modules' \
            ./ "$TARGET:$APP_ROOT/releases/$RELEASE_SHA/"

      - name: Configure optional scene artwork
        env:
          RELEASE_SHA: ${{ github.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Workers AI secrets are not configured; keeping cached scene generation disabled."
            exit 0
          fi
          {
            printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | base64 -w0
            printf '\n'
            printf '%s' "$CLOUDFLARE_API_TOKEN" | base64 -w0
            printf '\n'
          } | ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "APP_ROOT=$APP_ROOT bash $APP_ROOT/releases/$RELEASE_SHA/deploy/server/configure-scene-artwork.sh"

      - name: Run deploy script
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "bash $APP_ROOT/releases/$RELEASE_SHA/deploy/server/deploy-release.sh $RELEASE_SHA"

      # T_audit_4: probe the PUBLIC URL from the GH runner (external to the VPS),
      # so an nginx/TLS/DNS regression after deploy fails the job loudly. The
      # in-script wait_for_api_health hits 127.0.0.1:3001/health on the VPS and
      # therefore bypasses nginx — the 2026-05-27 incident slipped through that
      # gap. Hard fail: non-2xx after 3 retries blocks the green-deploy signal.
      # /api/health is trivial ({ok:true}) and unaffected by the catalog-summary
      # first-fetch flake (T_audit_5), so this won't false-alarm.
      - name: Post-deploy external smoke
        run: |
          set -euo pipefail
          url="https://radioatlas.ru/api/health"
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            --max-time 10 --retry 3 --retry-delay 5 "$url" || echo 000)"
          echo "smoke: $url -> HTTP $code"
          echo "smoke body: $(cat "$body")"
          if [ "$code" != "200" ]; then
            echo "::error::External smoke failed for $url (HTTP $code)"
            exit 1
          fi
          # Sanity-check the JSON contract too — a 200 with the wrong body
          # would still mean something's wrong upstream of nginx.
          grep -q '"ok"\s*:\s*true' "$body" || {
            echo "::error::Smoke body missing {ok:true}"
            cat "$body"
            exit 1
          }

      - name: Seed reusable scene pack
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "APP_ROOT=$APP_ROOT bash $APP_ROOT/current/deploy/server/seed-scene-artwork.sh"

      # seed-scene-artwork.sh above is a first-boot bootstrap: it stops entirely
      # once the active style has >=8 images, so it spent the daily allowance on
      # almost no days at all. This installs the recurring job that does.
      # Idempotent, and a clean no-op when the SSH user cannot write a unit.
      - name: Install nightly scene top-up timer
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "APP_ROOT=$APP_ROOT bash $APP_ROOT/current/deploy/server/install-scene-seeder.sh"

      - name: Report scene generation status
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "APP_ROOT=$APP_ROOT bash $APP_ROOT/current/deploy/server/report-scene-artwork.sh"
