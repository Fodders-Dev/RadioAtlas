name: Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: radioatlas-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"

      - name: Create release archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=apps/webapp/node_modules \
            --exclude=apps/webapp/dist \
            --exclude=apps/api/dist \
            --exclude=apps/bot/dist \
            --exclude=apps/api/data \
            --exclude=apps/extractor/build \
            --exclude=apps/extractor/.gradle \
            --exclude=output \
            --exclude=.tmp \
            -czf /tmp/radioatlas-release.tgz .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifacts
        run: |
          scp -i ~/.ssh/deploy_key /tmp/radioatlas-release.tgz "$SERVER_USER@$SERVER_HOST:/tmp/radioatlas-release.tgz"
          scp -i ~/.ssh/deploy_key deploy/deploy-release.sh "$SERVER_USER@$SERVER_HOST:/tmp/radioatlas-deploy-release.sh"

      - name: Run remote deploy
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" \
            "chmod +x /tmp/radioatlas-deploy-release.sh && /tmp/radioatlas-deploy-release.sh /tmp/radioatlas-release.tgz ${SHORT_SHA}"
