<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <link rel="manifest" href="/manifest.json" />
    <title>RadioAtlas minimal player</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #101418; color: #f3f5f6; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)); }
      main { width: min(100%, 560px); margin: 0 auto; }
      h1 { font-size: 1.55rem; line-height: 1.2; margin: 0 0 8px; }
      p { color: #c4cbd0; margin: 8px 0 16px; }
      .card { border: 1px solid #3a444b; border-radius: 16px; background: #192127; padding: 16px; margin: 12px 0; }
      .status { overflow-wrap: anywhere; font: 0.9rem/1.6 ui-monospace, monospace; color: #d3d9dd; }
      .controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      button { min-height: 48px; border: 1px solid #71818b; border-radius: 12px; padding: 10px 14px; background: #26343c; color: inherit; font: inherit; font-weight: 650; }
      button:focus-visible, textarea:focus-visible { outline: 3px solid #8bd8ff; outline-offset: 2px; }
      button.primary { background: #d4edfa; border-color: #d4edfa; color: #10212b; }
      button:disabled { opacity: .55; }
      textarea { width: 100%; min-height: 180px; resize: vertical; color: inherit; background: #101418; border: 1px solid #71818b; border-radius: 8px; padding: 10px; }
      .warning { color: #ffe1a6; }
      [hidden] { display: none !important; }
      @media (max-width: 350px) { body { padding-left: 12px; padding-right: 12px; } .card { padding: 12px; } }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Минимальный нативный плеер</h1>
      <p id="intro">Одна станция, один нативный audio-элемент. Это диагностический экран, не исправление фонового звука.</p>
      <section class="card" aria-labelledby="station-title">
        <h2 id="station-title">NoLife-Radio</h2>
        <p id="pwa-warning" class="warning" hidden>Открыто во вкладке. Для проверки установленного PWA откройте этот экран из приложения.</p>
        <div id="status" class="status" aria-live="polite"></div>
      </section>
      <section id="controls" class="card controls" aria-label="Управление">
        <button id="play" class="primary" type="button">Play</button>
        <button id="pause" type="button">Pause</button>
        <button id="heard" type="button">Я слышу звук</button>
        <button id="silent" type="button">Я не слышу звук</button>
        <button id="copy" type="button">Скопировать журнал</button>
        <button id="return" type="button">Вернуться в RadioAtlas</button>
        <button id="fresh" type="button" hidden>Начать новую запись</button>
      </section>
      <section class="card">
        <p id="recording" aria-live="polite"></p>
        <label for="report">Локальный отчёт. Скопируйте или выделите текст вручную.</label>
        <textarea id="report" readonly></textarea>
        <p id="copy-status" aria-live="polite"></p>
      </section>
      <audio id="lab-audio" preload="none" playsinline></audio>
    </main>
    <script type="module" src="/src/audioLab.ts"></script>
  </body>
</html>
