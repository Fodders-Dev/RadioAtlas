<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1514" />
    <!-- Belt-and-suspenders for the HTML shell. Caddy already sends
         `Cache-Control: no-store`, but Chrome has been observed to
         honour the meta tag in cases where the response header is
         dropped by an extension or proxy. /assets/* still serve with
         the long immutable cache via vite's content hashing. -->
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <!-- Telegram WebApp SDK. Loaded synchronously at the top of <head>
         so `window.Telegram.WebApp` is populated BEFORE the Vite module
         script below and therefore BEFORE any React useEffect runs.
         `defer` would push execution past DOMContentLoaded and race the
         mount-effect that calls tg.ready() / tg.expand(); `async` is
         unordered. The script is ~5 KB gzipped and the CDN is on the
         critical path inside Telegram anyway. If the load fails (CSP,
         offline, telegram.org down) `window.Telegram` stays undefined
         and every call site falls back gracefully through
         getTelegramWebApp() in src/lib/telegram.ts. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Manrope is served from our own origin now; src/boot.css carries the
         @font-face rules and the measurement that made that non-negotiable (a
         HANGING request to a font CDN produced no paint at all within
         25 seconds, on the kind of network this app actually lives on).
         Preloaded here rather than only declared in CSS: these are the two
         subsets a Russian-first UI with Latin station names always needs, so
         starting them at HTML-parse time costs nothing we were not going to
         spend. `crossorigin` is required on font preloads even same-origin. -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <title>RadioAtlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
