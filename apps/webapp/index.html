<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1514" />
    <!-- Belt-and-suspenders for the HTML shell. nginx already sends
         `Cache-Control: no-store`, but Chrome has been observed to
         honour the meta tag in cases where the response header is
         dropped by an extension or proxy. /assets/* still serve with
         the long immutable cache via vite's content hashing. -->
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RadioAtlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
