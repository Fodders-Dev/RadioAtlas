<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1514" />
    <!-- Belt-and-suspenders for the HTML shell. Caddy already sends
         `Cache-Control: no-store`, but Chrome has been observed to
         honour the meta tag in cases where the response header is
         dropped by an extension or proxy. /assets/* still serve with
         the long immutable cache via vite's content hashing. -->
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <!-- Telegram WebApp SDK. Loaded synchronously at the top of <head>
         so `window.Telegram.WebApp` is populated BEFORE the Vite module
         script below and therefore BEFORE any React useEffect runs.
         `defer` would push execution past DOMContentLoaded and race the
         mount-effect that calls tg.ready() / tg.expand(); `async` is
         unordered. The script is ~5 KB gzipped and the CDN is on the
         critical path inside Telegram anyway. If the load fails (CSP,
         offline, telegram.org down) `window.Telegram` stays undefined
         and every call site falls back gracefully through
         getTelegramWebApp() in src/lib/telegram.ts. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable on a phone home screen and, on Windows or macOS, as a real
         window with its own icon — which is the desktop app, without a second
         program to write. See public/sw.js for what the worker will and will not
         touch; audio and the shell are deliberately left alone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Manrope is served from our own origin now; src/boot.css carries the
         @font-face rules and the measurement that made that non-negotiable (a
         HANGING request to a font CDN produced no paint at all within
         25 seconds, on the kind of network this app actually lives on).
         Preloaded here rather than only declared in CSS: these are the two
         subsets a Russian-first UI with Latin station names always needs, so
         starting them at HTML-parse time costs nothing we were not going to
         spend. `crossorigin` is required on font preloads even same-origin. -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Link preview and search. Until this existed, a link to RadioAtlas
         dropped into any chat showed nothing at all: no picture, no line of
         text, not even a description — just a bare URL. That is a growth
         mechanism failing on two missing tags, and sharing is the only way the
         first listeners arrive at a product nobody has heard of.

         No counts anywhere. "46 048 stations" is true today and stale the first
         time the catalogue moves, and it would be baked into a cached preview
         that Telegram and Google hold for a long time.

         og:image is a committed PNG rather than a route: a crawler must not
         depend on our API being up, and the picture is cached for weeks anyway.
         Redraw it with `node scripts/buildOgCover.mjs`. -->
    <meta
      name="description"
      content="Живое радио мира. Станции со всего света, живой эфир и то, что играет прямо сейчас. Где-то сейчас идёт передача — включи и окажешься там."
    />
    <link rel="canonical" href="https://radioatlas.ru/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RadioAtlas" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://radioatlas.ru/" />
    <meta property="og:title" content="RadioAtlas — живое радио мира" />
    <meta
      property="og:description"
      content="Станции со всего света, живой эфир и то, что играет прямо сейчас. Где-то сейчас идёт передача — включи и окажешься там."
    />
    <meta property="og:image" content="https://radioatlas.ru/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RadioAtlas — живое радио мира" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RadioAtlas — живое радио мира" />
    <meta
      name="twitter:description"
      content="Станции со всего света, живой эфир и то, что играет прямо сейчас."
    />
    <meta name="twitter:image" content="https://radioatlas.ru/og-cover.png" />

    <title>RadioAtlas — живое радио мира</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
