<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" x2="0.8" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0703"/>
      <stop offset="0.52" stop-color="#1b1206"/>
      <stop offset="1" stop-color="#0a0602"/>
    </linearGradient>
    <radialGradient id="pulse" cx="72%" cy="20%" r="58%">
      <stop offset="0" stop-color="#ffba44" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ff8e1e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8e1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta" cx="16%" cy="42%" r="50%">
      <stop offset="0" stop-color="#ff7a2e" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#d65a18" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d65a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#ffcf6a" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#ffcf6a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffcf6a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#ffb84d" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="grain">
      <feTurbulence baseFrequency="0.85" numOctaves="2" seed="31" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA tableValues="0 0.1" type="table"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="44%" r="72%">
      <stop offset="0" stop-color="#0a0500" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#0a0500" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0500" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="2560" fill="url(#base)"/>
  <rect width="1440" height="2560" fill="url(#pulse)"/>
  <rect width="1440" height="2560" fill="url(#magenta)"/>
  <g transform="translate(720 1610) scale(1 0.48)" opacity="0.8">
    <circle r="190" fill="none" stroke="#ffc24d" stroke-opacity="0.34" stroke-width="3"/>
    <circle r="330" fill="none" stroke="#ffc24d" stroke-opacity="0.22" stroke-width="3"/>
    <circle r="520" fill="none" stroke="#ffc24d" stroke-opacity="0.14" stroke-width="3"/>
    <circle r="780" fill="none" stroke="#ffc24d" stroke-opacity="0.08" stroke-width="3"/>
  </g>
  <path d="M0 1020H1440" stroke="url(#scan)" stroke-width="5" opacity="0.6" filter="url(#blur)"/>
  <path d="M0 1738H1440" stroke="url(#scan)" stroke-width="3" opacity="0.34"/>
  <g transform="translate(0 760) skewY(-8)">
    <rect width="1440" height="960" fill="url(#grid)" opacity="0.6"/>
  </g>
  <g stroke="#ffce7a" stroke-linecap="round">
    <path d="M232 510h94m-47-47v94" stroke-opacity="0.28" stroke-width="3"/>
    <path d="M1048 704h128m-64-64v128" stroke-opacity="0.2" stroke-width="3"/>
    <path d="M340 1880h156m-78-78v156" stroke-opacity="0.16" stroke-width="4"/>
  </g>
  <rect width="1440" height="2560" filter="url(#grain)" opacity="0.4"/>
  <rect width="1440" height="2560" fill="url(#vignette)"/>
</svg>
