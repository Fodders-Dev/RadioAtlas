server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name radioatlas.duckdns.org;

    ssl_certificate /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/radioatlas.duckdns.org/radioatlas.duckdns.org.crt;
    ssl_certificate_key /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/radioatlas.duckdns.org/radioatlas.duckdns.org.key;
    root /opt/RadioAtlas/current/apps/webapp/dist;
    index index.html;
    sendfile off;
    aio off;
    tcp_nopush off;

    # Compress JSON / JS / CSS / SVG so the 6 MB /catalog/points
    # payload (54k stations × country/state/name) ships as ~1.4 MB
    # over the wire. Default nginx does NOT gzip proxied responses
    # without `gzip_proxied any`, and only gzips text/html out of
    # the box — both fixed here.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
      application/json
      application/javascript
      text/javascript
      text/css
      text/plain
      image/svg+xml
      application/manifest+json;

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api {
        return 307 /api/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /site.webmanifest {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /index.html {
        try_files $uri =503;
        expires -1;
        # `no-cache` lets Chrome reuse a stale HTML if it deems the
        # connection "fresh enough", which has bitten us across
        # back-to-back deploys. `no-store` forbids any local copy at
        # all, so the browser always pulls a fresh document and the
        # asset hashes inside always match what's actually on disk.
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
